[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W=pycodestyle, F=pyflakes, I=isort, UP=pyupgrade, B=bugbear, C4=comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
# UP042: manter `(str, Enum)` em vez de StrEnum — StrEnum muda o str() do enum,
# que é usado na serialização (pydantic/Celery); não vale a mudança de comportamento.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# B008: usar Form()/File() em defaults é o padrão idiomático do FastAPI.
"app/web/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
